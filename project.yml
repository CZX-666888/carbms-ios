name: CarbmsOwner
options:
  bundleIdPrefix: com.chezhixin
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  CarbmsOwner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chezhixin.carbms
        PRODUCT_NAME: CarbmsOwner
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
